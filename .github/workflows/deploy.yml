name: Deploy Silk Web

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "admin.html,assets,backend,cases.html,deploy,index.html,package.json,robots.txt,services.html,sitemap.xml,README.md,.gitignore"
          target: "/var/www/silkweb"
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            sudo mkdir -p /var/www/silkweb
            sudo chown -R $USER:$USER /var/www/silkweb
            sudo mkdir -p /etc/silkweb
            cat <<EOF | sudo tee /etc/silkweb/silkweb.env > /dev/null
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            EOF
            cd /var/www/silkweb
            mkdir -p backend/data uploads
            sudo cp deploy/silkweb.service /etc/systemd/system/silkweb.service
            sudo systemctl daemon-reload
            sudo systemctl enable silkweb.service
            sudo systemctl restart silkweb.service
